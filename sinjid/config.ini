# Sinjid: Shadow of the Warrior – configuration
# Delete this file to reset to defaults.

# Set to 0 to auto-size to 80% of the monitor (default).
# Set explicit pixel values to fix the window size, e.g:
#   window_w = 1920
#   window_h = 1440
window_w  = 0
window_h  = 0
fps       = 60

# Master volume: 0.0 (silent) to 1.0 (full)
volume    = 1.0

# Path to the save file
save_path = sinjid_save.dat

# Directory containing .dat data files
data_dir  = data
